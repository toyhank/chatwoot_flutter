name: 持续集成

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - testing
  push:
    branches:
      - main
      - master
      - develop
      - testing

jobs:
  analyze-and-test:
    name: 代码分析和测试
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: 获取依赖
        run: flutter pub get

      - name: 分析代码
        run: flutter analyze

      - name: 格式化检查
        run: dart format --set-exit-if-changed .

      - name: 运行测试
        run: flutter test

      - name: 构建 Web（开发环境）
        run: flutter build web --release --web-renderer html --dart-define=ENV=development

      - name: 构建 Web（测试环境）
        run: flutter build web --release --web-renderer html --dart-define=ENV=testing

      - name: 构建 Web（生产环境）
        run: flutter build web --release --web-renderer html --dart-define=ENV=production

