name: xxcard
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.1+4

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI 图标
  cupertino_icons: ^1.0.8
  
  # 网络请求
  dio: ^5.4.0
  http: ^1.2.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # 状态管理
  provider: ^6.1.1
  
  # 本地存储
  shared_preferences: ^2.2.2
  
  # WebView (用于客服页面)
  # webview_flutter: ^4.4.4
  # webview_flutter_android: ^3.16.0  # Android 平台特定配置
  flutter_inappwebview: ^6.0.0  # 更好的 WebView 支持（支持 WebMessageListener）
  
  # 图片选择
  image_picker: ^0.8.9
  
  # 加密（用于 Chatwoot HMAC）
  crypto: ^3.0.3
  
  # 路由管理
  go_router: ^13.0.0
  
  # 日期格式化
  intl: ^0.19.0
  
  # Toast 提示
  fluttertoast: ^8.2.4
  
  # 加载动画
  flutter_spinkit: ^5.2.0

  # Firebase 推送通知
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  
  # 本地通知支持（用于前台推送消息显示）
  flutter_local_notifications: ^18.0.1
  
  # 日志查看器
  talker_flutter: ^4.6.0

  # Chatwoot 使用 WebView 集成（支持全平台）
  # webview_flutter 已在上面声明

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: 3.11.1  # 兼容 Flutter 3.6.0+ 且支持 patrol_cli 3.6+

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "icon.png"

dependency_overrides:
  # 解决版本冲突
  intl: ^0.19.0
  # 解决 V1 embedding 问题，强制升级到最新版
  file_picker: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/chatwoot.html
    - assets/chatwoot_mobile.html
